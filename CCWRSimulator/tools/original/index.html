<!doctype html>
<meta charset="utf-8">
<title>IshidaVR — original</title>
<style>
  body { margin:0; background:#111; color:#ddd; font:13px system-ui; }
  #bar { padding:6px 10px; }
  #stage { width:800px; height:600px; }
</style>
<div id="bar">status: <span id="s">booting…</span> · stage <span id="r">?</span></div>
<div id="stage"></div>
<script>
  // Ruffle ignores preferredRenderer:'canvas' on this machine and takes WebGL,
  // whose canvas reads back BLANK from toDataURL unless the context was created
  // with preserveDrawingBuffer. Ruffle does not expose that, so the context
  // request is intercepted here, before ruffle.js loads, and the flag added.
  const realGetContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
      attrs = Object.assign({}, attrs || {}, { preserveDrawingBuffer: true });
    }
    return realGetContext.call(this, type, attrs);
  };
</script>
<script src="node_modules/@ruffle-rs/ruffle/ruffle.js"></script>
<script>
  const s = document.getElementById('s');
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: 'on', unmuteOverlay: 'hidden', contextMenu: 'off',
    // The WebGL canvas reads back blank (no preserveDrawingBuffer), and these
    // screens have to be captured as artwork, so render on 2D canvas instead.
    preferredRenderer: 'canvas',
    warnOnUnsupportedContent: false, logLevel: 'warn',
  };
  window.addEventListener('load', () => {
    try {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.style.width = '800px';
      player.style.height = '600px';
      document.getElementById('stage').appendChild(player);
      window.__player = player;
      player.load('IshidaVR.swf').then(() => {
        s.textContent = 'loaded';
        // A driver needs the canvas's real position and scale: Ruffle fits the
        // 800x600 stage to the element, so a click in movie coordinates has to
        // be mapped through this or every hit lands somewhere else.
        const report = () => {
          const c = player.shadowRoot?.querySelector('canvas') || player;
          const b = c.getBoundingClientRect();
          window.__stage = { x: b.x, y: b.y, w: b.width, h: b.height,
                             scale: b.width / 800 };
          document.getElementById('r').textContent =
            `${Math.round(b.x)},${Math.round(b.y)} ${Math.round(b.width)}x${Math.round(b.height)}`;
        };
        report();
        window.addEventListener('resize', report);
        // Capture the stage and post it back to serve.py, which writes the
        // file. The backing store is larger than 800x600, so it is downsampled
        // there rather than here — supersampling gives a cleaner result than
        // rendering at 1:1 would.
        window.__grab = async (name) => {
          const canvas = player.shadowRoot.querySelector('canvas');
          const url = canvas.toDataURL('image/png');
          const res = await fetch('/save?name=' + encodeURIComponent(name), {
            method: 'POST', body: url,
          });
          return res.ok ? await res.text() : 'failed: ' + res.status;
        };

        // Movie coordinates in, a page click out.
        window.__at = (x, y) => ({
          x: Math.round(window.__stage.x + x * window.__stage.scale),
          y: Math.round(window.__stage.y + y * window.__stage.scale),
        });
      }).catch((e) => { s.textContent = 'load failed: ' + e; });
    } catch (e) { s.textContent = 'ruffle failed: ' + e; }
  });
</script>
