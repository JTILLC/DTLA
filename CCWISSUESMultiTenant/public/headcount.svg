  <rect x="36.46" y="20.5" width="5.31" height="11.0" rx="1.7" fill="#10b981"/>
  <rect x="43.57" y="20.5" width="5.31" height="11.0" rx="1.7" fill="#10b981"/>
  <rect x="50.69" y="20.5" width="5.31" height="11.0" rx="1.7" fill="#10b981"/>
  <rect x="8.00" y="33.5" width="5.31" height="11.0" rx="1.7" fill="#10b981"/>
