<!-- Headcount — app icon.
     Fourteen weigh heads in two rows of seven, one of them down. It is the
     grid the Overview opens on and the thing an operator actually looks at,
     so the icon is the app's own picture of a machine rather than a clipboard.
     One head red on purpose: an icon where everything is fine says nothing,
     and the one that isn't fine is the whole point of the app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Headcount">
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <rect x="8.00" y="20.5" width="5.31" height="11.0" rx="1.7" fill="#10b981"/>
  <rect x="15.11" y="20.5" width="5.31" height="11.0" rx="1.7" fill="#10b981"/>
  <rect x="22.23" y="20.5" width="5.31" height="11.0" rx="1.7" fill="#10b981"/>
