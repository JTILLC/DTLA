<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Ishida Weigher Issue Logger</title>
  <link rel="icon" type="image/png" href="/mdtl.png" sizes="1024x1024" />
  <link rel="shortcut icon" href="/mdtl.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/mdtl.png" />
  <meta name="apple-mobile-web-app-title" content="CCW Issues" />
  <link rel="manifest" href="/site.webmanifest" />
  <script type="module" crossorigin src="/assets/index-qNxPGpMr.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/react-bootstrap-BkGAifsw.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-BDryFDel.js">
  <link rel="stylesheet" crossorigin href="/assets/index-D-QWvwr2.css">
</head>
<body>
  <div id="root">
    <div id="loading-fallback" style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: system-ui, sans-serif;">
      <div style="text-align: center; padding: 20px;">
        <p style="font-size: 18px; color: #333;">Loading CCW Issues...</p>
        <p style="font-size: 14px; color: #666;">If this message persists, please refresh or try a different browser.</p>
      </div>
    </div>
  </div>
  <script>
    // Log uncaught errors but DON'T nuke the app for cross-origin "Script error"
    // (those are sanitized by the browser for third-party scripts like Bootstrap
    // CDN and carry no useful detail). React's ErrorBoundary handles real errors.
    window.onerror = function(msg, url, line, col, error) {
      console.error('Global error:', msg, url, line, col, error);
      // Only show the full-page fallback when we have a real stack trace AND
      // the error clearly came from our own bundle — skips CDN noise.
      var isCrossOriginNoise = !error || (msg && /script error/i.test(msg));
      if (isCrossOriginNoise) return false;
      var root = document.getElementById('root');
      if (root && root.children.length <= 1) {
        // Only replace if nothing meaningful has rendered yet. Build with the DOM
        // API (textContent) so the browser-supplied msg/url can't inject markup.
        root.textContent = '';
        var wrap = document.createElement('div');
        wrap.style.cssText = 'padding: 20px; font-family: system-ui, sans-serif;';
        var h = document.createElement('h2'); h.style.color = 'red'; h.textContent = 'App Error';
        var p1 = document.createElement('p'); p1.textContent = 'Error: ' + msg;
        var p2 = document.createElement('p'); p2.textContent = 'Location: ' + url + ' (line ' + line + ')';
        var p3 = document.createElement('p'); p3.textContent = 'Please try refreshing the page or use a different browser.';
        var btn = document.createElement('button');
        btn.textContent = 'Refresh';
        btn.style.cssText = 'padding: 10px 20px; font-size: 16px; cursor: pointer;';
        btn.onclick = function () { location.reload(); };
        wrap.appendChild(h); wrap.appendChild(p1); wrap.appendChild(p2); wrap.appendChild(p3); wrap.appendChild(btn);
        root.appendChild(wrap);
      }
      return false;
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
