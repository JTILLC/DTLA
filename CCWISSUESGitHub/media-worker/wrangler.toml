name = "ccw-media"
main = "src/index.js"
compatibility_date = "2026-07-01"
# The Anthropic SDK (used by /scan-weights) expects a few Node built-ins.
compatibility_flags = ["nodejs_compat"]

# Non-secret config (safe to commit).
[vars]
FIREBASE_PROJECT_ID = "downtimelogger-a96fb"
STORAGE_BUCKET      = "downtimelogger-a96fb.firebasestorage.app"
# Comma-separated. Needed for the canvas reads the PDF export performs.
# Wildcards cover Cloudflare Pages preview deploys, which each get their own
# hostname (<branch>.<project>.pages.dev and <hash>.<project>.pages.dev).
ALLOWED_ORIGIN = "https://jti-ccw-viewer.pages.dev,https://jti-issues.pages.dev,https://jti-issues-mt.pages.dev,https://jti-shearers.pages.dev,https://jti-dashboard.pages.dev,*.jti-ccw-viewer.pages.dev,*.jti-issues.pages.dev,*.jti-issues-mt.pages.dev,*.jti-shearers.pages.dev,*.jti-dashboard.pages.dev,http://localhost:5173,http://localhost:5174"

# Firebase projects whose ID tokens /scan-weights will accept. Shearers is a
# SEPARATE Firebase project, so without listing it here its tokens fail the
# audience check. Media routes are unaffected — they still use
# FIREBASE_PROJECT_ID alone, because share links and storage paths are
# CCW-specific.
SCAN_PROJECT_IDS = "downtimelogger-a96fb,shearers-4c4b4"

# The Parts Viewer catalog lives in its own Firebase project. A folder there is
# one machine, which is what a CCW line gets bound to.
PARTS_PROJECT_ID = "jobs-data-17ee4"
PARTS_BUCKET     = "jobs-data-17ee4.firebasestorage.app"

# The JTI workspace every customer lives under, so the Worker can read a
# plant's crew roster when counting billable seats.
WORKSPACE_UID    = "tgezUokMZ1PO7iEDbLbj2U7Uwbx1"

# Where the nightly backups are written, and how long they are kept.
# Retention is DELIBERATELY unset: with no value nothing is ever deleted. Set it
# to a number of days once you have seen the backups arriving and are happy.
BACKUP_BUCKET      = "downtimelogger-a96fb.firebasestorage.app"

# Shearers is a Realtime Database, not Firestore, so it is exported separately.
SHEARERS_DB_URL    = "https://shearers-4c4b4-default-rtdb.firebaseio.com"
SHEARERS_DB_PATH   = "jti-downtime/main-logger/data"

# Timesheets. The project is named here so the skip reason is precise about
# what is actually missing — a service account, not the project id.
TIMESHEET_PROJECT_ID = "timesheetapp-c4e54"
# BACKUP_RETAIN_DAYS = "30"

# Secrets — set with wrangler, never commit:
#   npx wrangler secret put GCP_SA_EMAIL
#   npx wrangler secret put GCP_SA_PRIVATE_KEY   # the private_key field from the service account JSON
#   npx wrangler secret put ANTHROPIC_API_KEY    # /scan-weights only; without it that route returns 503
#   npx wrangler secret put PARTS_SA_EMAIL       # /parts/* only; service account on the PARTS project
#   npx wrangler secret put PARTS_SA_PRIVATE_KEY # same; without both, /parts/* returns 503
#
#   npx wrangler secret put TIMESHEET_SA_EMAIL     # optional; without it timesheets are NOT backed up
#   npx wrangler secret put TIMESHEET_SA_PRIVATE_KEY
#
# Deploy:
#   cd media-worker && npx wrangler deploy

# Nightly backup. 09:00 UTC is 02:00 in Arizona — after the day's work and
# before anyone starts, so a run never competes with a plant using the app.
[triggers]
crons = ["0 9 * * *"]
